# The name of your service
# Purely cosmetic
SERVICE_NAME="MyApp"

# The postgres name of your database
# Required for proper script execution 
DB_NAME="my_app_db"
# The default user running db queries
DB_USER="postgres"
# The default group allowed to manage db without root
DB_ADMIN_GROUP="postgres"
# The network address of your database server
# Use "localhost" or "127.0.0.1" for local, or an IP/domain for remote
DB_HOST="localhost"
# The network port your database listens on (default is 5432)
DB_PORT="5432"

# The directory with db queries 
SQL_DIR="./sql"
# The regex pattern used to match SQL files inside SQL_DIR
# Files must start with a numeric prefix followed by "_" for --run --from/--to flags to work
SQL_PATTERN='^[0-9][0-9]_.*\.sql$'

# The tables of your database
# Required for proper script execution
REQUIRED_TABLES=(
    "users"
    "items"
    "orders"
    "shop_stats"
)

# Extra schemas that "--user grant -u <name> --level all" should also grant USAGE on
# (e.g. pg_cron's "cron" schema). Leave empty if not needed.
EXTRA_SCHEMAS=()

# Script log files directory
LOG_DIR="./db_manager_logs"
# Log files name patter
# For timestamps inside file name Unix "time" command naming conventions apply
# See `man -P 'less -p "^FORMATTING THE OUTPUT"' time` for more information
LOG_FILE_NAME_PATTERN="%Y-%m-%d_%H:%M:%S_MyApp.log"

# Startup/Shutdown text verbosity 
# Purely cosmetic
HELLO="full" # full | minimal | quiet
BYE="full" # full | minimal | quiet

# Terminal execution log
# Controls how much detail is printed in terminal during work
VERBOSITY="full" # full | minimal | quiet

# Contols if banner of your db will be printed at the startup
BANNER="yes" # yes | no
BANNER_TEXT='
  __  __                                _____  ____  
 |  \/  |           /\                 |  __ \|  _ \ 
 | \  / |_   _     /  \   _ __  _ __   | |  | | |_) |
 | |\/| | | | |   / /\ \ | `_ \| `_ \  | |  | |  _ < 
 | |  | | |_| |  / ____ \| |_) | |_) | | |__| | |_) |
 |_|  |_|\__, | /_/    \_\ .__/| .__/  |_____/|____/ 
          __/ |          | |   | |                   
         |___/           |_|   |_|
'

# Default colors are: GREEN | RED | YELLOW| ORANGE | BLUE | NC

# Custom colors example
#CYAN='\e[36m'

# Overrides default hightlighting
#HIGHLIGHT=$CYAN
#WARNING=
#NOTICE=
#ERROR=